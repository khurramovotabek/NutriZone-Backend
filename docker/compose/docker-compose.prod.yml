name: nutrizone-prod

x-django-env: &django-env
  env_file:
    - ../../.env

# stdout logs of the app containers (recreated on every deploy): capped, they had no limit -- `docker compose logs`
# keeps the last 5 x 20 MB. db/redis/nginx don't carry it yet: changing their logging recreates them (a short outage).
x-logging: &logging
  logging:
    driver: json-file
    options: {max-size: "20m", max-file: "5"}

services:
  db:
    image: postgis/postgis:16-3.4
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [nutrizone_net]
    # No published ports in production -- only reachable from other
    # services on the internal network.

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [nutrizone_net]

  # Real, closed gap: this is the ONLY service in this file that runs
  # "python manage.py migrate" -- see docker-compose.yml's own,
  # identical comment for the full rationale.
  migrate:
    <<: [*logging, *django-env]
    build:
      context: ../../
      dockerfile: docker/django/Dockerfile
      target: production
    environment:
      DJANGO_ENV: production
    entrypoint: ["/migrate-entrypoint.sh"]
    command: []
    restart: "no"
    volumes:
      - static_volume:/app/static  # collectstatic writes here; nginx serves it
    depends_on:
      db: {condition: service_healthy}
    networks: [nutrizone_net]

  web:
    <<: [*logging, *django-env]
    build:
      context: ../../
      dockerfile: docker/django/Dockerfile
      target: production
    environment:
      DJANGO_ENV: production
      LOG_ROTATION: external  # rotated by the host's logrotate (docker/deploy/host-logrotate.sh)
    # One ASGI server for HTTP and WebSockets (chat) -- gunicorn managing
    # uvicorn workers; there is no separate WebSocket service.
    command: ["gunicorn", "config.asgi:application", "--worker-class", "uvicorn.workers.UvicornWorker", "--bind", "0.0.0.0:8000", "--workers", "4", "--timeout", "60", "--forwarded-allow-ips", "*"]
    restart: always
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    volumes:
      - media_volume:/app/media  # uploads -- shared by every replica and worker, served by nginx
      - app_logs:/app/logs  # errors.log & co. survive deploys (containers are recreated every time)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 2
    networks: [nutrizone_net]

  celery_worker_transactional:
    <<: [*logging, *django-env]
    build:
      context: ../../
      dockerfile: docker/django/Dockerfile
      target: production
    environment:
      DJANGO_ENV: production
      LOG_ROTATION: external  # rotated by the host's logrotate (docker/deploy/host-logrotate.sh)
    healthcheck:
      disable: true
    command: ["celery", "-A", "config", "worker", "-Q", "transactional,inventory_critical", "-c", "8", "-l", "info"]
    restart: always
    volumes:
      - media_volume:/app/media
      - app_logs:/app/logs
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    networks: [nutrizone_net]

  celery_worker_default:
    <<: [*logging, *django-env]
    build:
      context: ../../
      dockerfile: docker/django/Dockerfile
      target: production
    environment:
      DJANGO_ENV: production
      LOG_ROTATION: external  # rotated by the host's logrotate (docker/deploy/host-logrotate.sh)
    healthcheck:
      disable: true
    command: ["celery", "-A", "config", "worker", "-Q", "default", "-c", "4", "-l", "info"]
    restart: always
    volumes:
      - media_volume:/app/media
      - app_logs:/app/logs
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    networks: [nutrizone_net]

  celery_worker_bulk:
    <<: [*logging, *django-env]
    build:
      context: ../../
      dockerfile: docker/django/Dockerfile
      target: production
    environment:
      DJANGO_ENV: production
      LOG_ROTATION: external  # rotated by the host's logrotate (docker/deploy/host-logrotate.sh)
    healthcheck:
      disable: true
    command: ["celery", "-A", "config", "worker", "-Q", "bulk,dead_letter", "-c", "2", "-l", "info"]
    restart: always
    volumes:
      - media_volume:/app/media
      - app_logs:/app/logs
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    networks: [nutrizone_net]

  celery_beat:
    <<: [*logging, *django-env]
    build:
      context: ../../
      dockerfile: docker/django/Dockerfile
      target: production
    environment:
      DJANGO_ENV: production
      LOG_ROTATION: external  # rotated by the host's logrotate (docker/deploy/host-logrotate.sh)
    healthcheck:
      disable: true
    command: ["celery", "-A", "config", "beat", "-l", "info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    restart: always
    volumes:
      - app_logs:/app/logs
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    networks: [nutrizone_net]

  # Daily pg_dump with 14-day retention (docker/backup/pg-backup.sh). Copy the `backups` volume off this
  # server too (rsync/rclone to another machine or object storage) -- a backup on the same disk is not a backup.
  db_backup:
    image: postgis/postgis:16-3.4
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    entrypoint: ["/pg-backup.sh"]
    volumes:
      - ../backup/pg-backup.sh:/pg-backup.sh:ro
      - backups:/backups
    depends_on:
      db: {condition: service_healthy}
    networks: [nutrizone_net]

  nginx:
    image: nginx:1.27-alpine
    restart: always
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/static:ro
      - media_volume:/app/media:ro
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - web
    networks: [nutrizone_net]

networks:
  nutrizone_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  backups:
  app_logs:
