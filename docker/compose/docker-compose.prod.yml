name: nutrizone-prod

x-django-env: &django-env
  env_file:
    - ../../.env

services:
  db:
    image: postgis/postgis:16-3.4
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [nutrizone_net]
    # No published ports in production -- only reachable from other
    # services on the internal network.

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [nutrizone_net]

  # Real, closed gap: this is the ONLY service in this file that runs
  # "python manage.py migrate" -- see docker-compose.yml's own,
  # identical comment for the full rationale.
  migrate:
    build:
      context: ../../
      dockerfile: docker/django/Dockerfile
      target: production
    <<: *django-env
    environment:
      DJANGO_ENV: production
    entrypoint: ["/migrate-entrypoint.sh"]
    command: []
    restart: "no"
    volumes:
      - static_volume:/app/static  # collectstatic writes here; nginx serves it
    depends_on:
      db: {condition: service_healthy}
    networks: [nutrizone_net]

  web:
    build:
      context: ../../
      dockerfile: docker/django/Dockerfile
      target: production
    <<: *django-env
    environment:
      DJANGO_ENV: production
    # One ASGI server for HTTP and WebSockets (chat) -- gunicorn managing
    # uvicorn workers; there is no separate WebSocket service.
    command: ["gunicorn", "config.asgi:application", "--worker-class", "uvicorn.workers.UvicornWorker", "--bind", "0.0.0.0:8000", "--workers", "4", "--timeout", "60", "--forwarded-allow-ips", "*"]
    restart: always
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    volumes:
      - media_volume:/app/media  # uploads -- shared by every replica and worker, served by nginx
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 2
    networks: [nutrizone_net]

  celery_worker_transactional:
    build:
      context: ../../
      dockerfile: docker/django/Dockerfile
      target: production
    <<: *django-env
    environment:
      DJANGO_ENV: production
    command: ["celery", "-A", "config", "worker", "-Q", "transactional,inventory_critical", "-c", "8", "-l", "info"]
    restart: always
    volumes:
      - media_volume:/app/media
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    networks: [nutrizone_net]

  celery_worker_default:
    build:
      context: ../../
      dockerfile: docker/django/Dockerfile
      target: production
    <<: *django-env
    environment:
      DJANGO_ENV: production
    command: ["celery", "-A", "config", "worker", "-Q", "default", "-c", "4", "-l", "info"]
    restart: always
    volumes:
      - media_volume:/app/media
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    networks: [nutrizone_net]

  celery_worker_bulk:
    build:
      context: ../../
      dockerfile: docker/django/Dockerfile
      target: production
    <<: *django-env
    environment:
      DJANGO_ENV: production
    command: ["celery", "-A", "config", "worker", "-Q", "bulk,dead_letter", "-c", "2", "-l", "info"]
    restart: always
    volumes:
      - media_volume:/app/media
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    networks: [nutrizone_net]

  celery_beat:
    build:
      context: ../../
      dockerfile: docker/django/Dockerfile
      target: production
    <<: *django-env
    environment:
      DJANGO_ENV: production
    command: ["celery", "-A", "config", "beat", "-l", "info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    restart: always
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    networks: [nutrizone_net]

  # Daily pg_dump with 14-day retention (docker/backup/pg-backup.sh). Copy the `backups` volume off this
  # server too (rsync/rclone to another machine or object storage) -- a backup on the same disk is not a backup.
  db_backup:
    image: postgis/postgis:16-3.4
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    entrypoint: ["/pg-backup.sh"]
    volumes:
      - ../backup/pg-backup.sh:/pg-backup.sh:ro
      - backups:/backups
    depends_on:
      db: {condition: service_healthy}
    networks: [nutrizone_net]

  nginx:
    image: nginx:1.27-alpine
    restart: always
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/static:ro
      - media_volume:/app/media:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    networks: [nutrizone_net]

networks:
  nutrizone_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  backups:
