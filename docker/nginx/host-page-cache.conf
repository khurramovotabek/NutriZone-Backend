# Included in the nutrizone.uz server block by docker/deploy/host-nginx-tune.sh (marker: nz-page-cache).
# Micro-cache for public storefront pages. Next.js renders every page per request (the language comes from a cookie,
# so nothing is static) -- under a traffic spike Node.js becomes the bottleneck. A visitor WITHOUT a session/cart/
# referral/Mini App cookie sees exactly the same HTML as any other such visitor in the same language, so nginx keeps
# that HTML for a few seconds and serves it to everyone; while one request refreshes it in the background the rest
# get the stored copy (stale-while-revalidate). Logged-in shoppers, carts, checkout, account, /api, RSC navigation
# requests and anything that sets a cookie are never cached ($nz_page_skip, conf.d/nz-page-cache.conf, and
# $upstream_http_set_cookie below).
proxy_cache nz_pages;
proxy_cache_key "$scheme$host$request_uri|$nz_page_locale";
proxy_cache_bypass $nz_page_skip;
# nginx already never stores a response that carries Set-Cookie (verified locally with nginx 1.24); stated here too so
# a later "proxy_ignore_headers ... Set-Cookie" can't silently start caching e.g. a first-visit "nz_locale=ru", which
# would switch every later visitor to Russian.
proxy_no_cache $nz_page_skip $upstream_http_set_cookie;
proxy_cache_methods GET HEAD;
proxy_cache_valid 200 20s;
proxy_cache_valid 404 10s;
proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
proxy_cache_background_update on;
proxy_cache_lock on;
proxy_cache_lock_timeout 5s;
# Next.js marks every dynamic page "private, no-store"; the browser still gets that header (it must not keep the page),
# only this shared, few-seconds copy ignores it. Set-Cookie is NOT ignored: such a response is never stored.
proxy_ignore_headers Cache-Control Expires;
# HIT / MISS / BYPASS / STALE / UPDATING on every page response -- how to check the cache works (curl -sI).
add_header X-Page-Cache $upstream_cache_status always;
