# Included in the nutrizone.uz server block by docker/deploy/host-nginx-tune.sh (marker: nz-assets-cache).
# Next.js build assets and optimised images are served from nginx's disk cache instead of Node.js on every request:
# /_next/static files are content-hashed (never change), /_next/image answers are keyed by URL + the image format
# the browser accepts ($nz_img_fmt, conf.d/nz-assets-cache.conf), so an AVIF answer never reaches a WebP-only browser.
location /_next/static/ {
    proxy_pass http://nz_storefront;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache nz_assets;
    proxy_cache_valid 200 30d;
    proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
    proxy_cache_lock on;
    add_header X-Cache $upstream_cache_status always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    proxy_hide_header Cache-Control;
}
location /_next/image {
    proxy_pass http://nz_storefront;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache nz_assets;
    proxy_cache_key "$scheme$host$request_uri|$nz_img_fmt";
    proxy_cache_valid 200 7d;
    proxy_cache_valid 404 1m;
    proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
    proxy_cache_lock on;
    proxy_ignore_headers Vary;
    add_header X-Cache $upstream_cache_status always;
    add_header Vary Accept always;
}
