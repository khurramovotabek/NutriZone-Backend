worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain application/json application/javascript text/css;

    client_max_body_size 200M;  # matches DATA_UPLOAD_MAX_MEMORY_SIZE (video uploads, REST API Blueprint §11)

    upstream django_app {
        server web:8000;
    }

    server {
        listen 80;
        server_name _;

        # Security headers -- reinforces (does not replace) Django's own
        # SecurityMiddleware settings in production.py.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;

        location /static/ {
            alias /app/static/;
        }

        location /media/ {
            alias /app/media/;
        }

        # WebSocket traffic -> the same ASGI app server as every HTTP request
        # (config.asgi serves both); only the Upgrade headers differ.
        location /ws/ {
            proxy_pass http://django_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 3600s;
        }

        # Everything else (HTTP) -> the ASGI app server.
        location / {
            proxy_pass http://django_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location /health/live {
            proxy_pass http://django_app;
            proxy_set_header Host $host;
            access_log off;
        }
    }
}
