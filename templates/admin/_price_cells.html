{% load i18n %}{# Inline price inputs for one variant row of the price list (v = row or variant dict). #}
<span class="r wx-pl-cell"><input class="wx-pl-input" data-f="base_price" inputmode="numeric" value="{{ v.base_price|floatformat:0|default_if_none:'' }}" data-was="{{ v.base_price|floatformat:0|default_if_none:'' }}" placeholder="—" aria-label="{% translate 'Cost' %}">{% if v.last_cost is not None and v.last_cost %}<small title="{% translate 'Last goods-receipt cost' %}">{% translate "receipt" %}: {{ v.last_cost|floatformat:0 }}</small>{% endif %}</span>
<span class="r wx-pl-cell"><input class="wx-pl-input wx-pl-price" data-f="price" inputmode="numeric" value="{{ v.price|floatformat:0|default_if_none:'' }}" data-was="{{ v.price|floatformat:0|default_if_none:'' }}" placeholder="{% translate 'set price' %}" aria-label="{% translate 'Price' %}"></span>
<span class="r wx-pl-cell"><input class="wx-pl-input wx-pl-old" data-f="old_price" inputmode="numeric" value="{{ v.old_price|floatformat:0|default_if_none:'' }}" data-was="{{ v.old_price|floatformat:0|default_if_none:'' }}" placeholder="—" aria-label="{% translate 'Old price' %}"></span>
<span class="r" data-calc><small>—</small></span>
